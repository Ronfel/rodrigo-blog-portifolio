<section class="page-heading">
  <span class="eyebrow">Vamos conversar</span>
  <h1>Entre em contato<span style="color: var(--green)">.</span></h1>
  <p class="page-intro">
    Tem uma ideia, uma oportunidade ou simplesmente quer trocar experiências?
    Ficarei feliz em receber sua mensagem.
  </p>
</section>

<section class="contact-layout">
  <div>
    <div class="contact-detail">
      <span>E-mail</span>
      <a href="mailto:rodrigonflara@gmail.com">rodrigonflara&#64;gmail.com ↗</a>
    </div>
    <div class="contact-detail">
      <span>WhatsApp</span>
      <a
        href="https://wa.me/5515988261813"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Conversar com Rodrigo pelo WhatsApp (abre em nova aba)"
      >+55 (15) 98826-1813 ↗</a>
    </div>
  </div>

  <form class="contact-form" (ngSubmit)="sendMessage()">
    <div class="form-field">
      <label for="contact-name">Seu nome</label>
      <input id="contact-name" name="name" type="text" [(ngModel)]="name" required autocomplete="name" />
    </div>
    <div class="form-field">
      <label for="contact-email">Seu e-mail</label>
      <input id="contact-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </div>
    <div class="form-field">
      <label for="contact-message">Como posso ajudar?</label>
      <textarea id="contact-message" name="message" [(ngModel)]="message" required></textarea>
    </div>
    <button class="button" type="submit">Preparar mensagem <span aria-hidden="true">↗</span></button>
    <p class="form-note">O botão abre seu aplicativo de e-mail com a mensagem preenchida.</p>
  </form>
</section>
