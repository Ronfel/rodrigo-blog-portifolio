<div class="site-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Rodrigo, página inicial">
      <span class="brand-mark">R</span>
      <span>rodrigo<span class="brand-dot">.</span>dev</span>
    </a>

    <nav class="main-nav" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/sobre" routerLinkActive="active">Sobre mim</a>
      <a routerLink="/blog" routerLinkActive="active">Blog</a>
      <a class="nav-contact" routerLink="/contato" routerLinkActive="active">Contato <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="site-footer">
    <span>© {{ currentYear }} Rodrigo. Feito com cuidado e um pouco de café.</span>
    <a routerLink="/contato">Vamos conversar <span aria-hidden="true">↗</span></a>
  </footer>
</div>
